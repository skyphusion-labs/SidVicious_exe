name: coverage

# Free GitHub Actions check named `coverage` (org ruleset context).
# Does NOT use actions/upload-code-coverage -- that is paid Code Quality.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Root engines and ci.yml are Node 24. The suite imports bot.mjs.
          node-version: "24"
          cache: npm

      - name: JS/TS coverage
        if: hashFiles('package.json') != ''
        run: |
          set -euo pipefail
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi
          # `npm run --silent` prints nothing, so grepping it never sees
          # `test` or `test:coverage` and the job echoes success. `npm pkg get`
          # prints "{}" when the key is absent.
          if [ "$(npm pkg get scripts.test:coverage)" != "{}" ]; then
            npm run test:coverage
          elif [ "$(npm pkg get scripts.coverage)" != "{}" ]; then
            npm run coverage
          elif [ "$(npm pkg get scripts.test)" != "{}" ]; then
            npm test
          else
            echo "no test/coverage script; coverage check present"
          fi

      - name: Go coverage
        if: hashFiles('go.mod') != ''
        run: |
          set -euo pipefail
          go test ./... -cover

      - name: Present
        if: hashFiles('package.json') == '' && hashFiles('go.mod') == ''
        run: echo "no supported test manifest; coverage check present"
